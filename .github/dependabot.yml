version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /website
    schedule:
      interval: weekly
    # Wait before proposing new releases (supply-chain hardening; see website/bunfig.toml).
    cooldown:
      default-days: 7
