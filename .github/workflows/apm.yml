name: APM

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: imk1t/apm-shared@v0.1.3
        with:
          working-directory: .
          apm-version: 0.33.0
          targets: agent-skills,claude,codex
          policy: apm-policy.yml
