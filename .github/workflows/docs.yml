name: Docs

on:
  push:
    branches: [main]
    paths:
      - website/**
      - doc/**
      # The native API mapping is checked against the code it documents.
      - lib/**
      - android/src/main/**
      - ios/advanced_webview/Sources/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - website/**
      - doc/**
      # The native API mapping is checked against the code it documents.
      - lib/**
      - android/src/main/**
      - ios/advanced_webview/Sources/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment that is already running.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git history for "last updated"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
