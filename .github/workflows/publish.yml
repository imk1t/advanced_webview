# Publishes to pub.dev when a version tag (e.g. v0.1.0) is pushed, then creates a GitHub Release.
# Requires automated publishing to be enabled for this repository on pub.dev
# (package admin page > Automated publishing > GitHub Actions, tag pattern `v{{version}}`).
# The very first release must be published manually (`flutter pub publish`) beforehand.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # OIDC token for pub.dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to check that the tag is on main
      - name: Check the tag matches this commit
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version"
            exit 1
          fi
          if ! grep -Eq "^## ${tag//./\\.}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $tag' section"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
      # Configures the pub.dev OIDC credentials.
      - uses: dart-lang/setup-dart@v1
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --dry-run
      - run: flutter pub publish --force

  # Runs only after pub.dev accepted the package. Kept separate so the write token and
  # the pub.dev OIDC token are never in the same job.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v h="## $tag" '
            $0 == h || index($0, h " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
