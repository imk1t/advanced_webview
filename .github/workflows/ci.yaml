name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Pigeon output (*.g.dart) is committed as generated and not reformatted.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v '\.g\.dart$')
      - name: Check Pigeon output is up to date
        run: |
          dart run pigeon --input pigeons/messages.dart
          git diff --exit-code
      - run: flutter analyze
      - run: flutter test
      - name: Validate package for pub.dev
        run: flutter pub publish --dry-run

  kotlin-lint:
    runs-on: ubuntu-latest
    env:
      KTLINT_VERSION: 1.8.0
      KTLINT_SHA256: a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install ktlint
        run: |
          curl -sSLf -o "$RUNNER_TEMP/ktlint" \
            "https://github.com/pinterest/ktlint/releases/download/$KTLINT_VERSION/ktlint"
          echo "$KTLINT_SHA256  $RUNNER_TEMP/ktlint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/ktlint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Pigeon output (*.g.kt) is committed as generated and not linted.
      - name: ktlint
        run: ktlint --relative $(git ls-files '*.kt' '*.kts' | grep -v '\.g\.kt$')

  swift-lint:
    runs-on: ubuntu-latest
    # Pins the swift-format version (bundled with the toolchain as `swift format`).
    container: swift:6.4.1-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: swift format --version
      # Pigeon output (*.g.swift) is committed as generated and not formatted.
      - name: Check formatting
        run: |
          files=$(git ls-files '*.swift' | grep -v '\.g\.swift$')
          swift format --in-place $files
          git diff --exit-code
      - name: swift-format lint
        run: swift format lint --strict $(git ls-files '*.swift' | grep -v '\.g\.swift$')

  android:
    runs-on: ubuntu-latest
    needs: dart
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug
      - name: Kotlin unit tests (Robolectric)
        working-directory: example/android
        run: ./gradlew :flutter_mobile_webview:testDebugUnitTest

  android-integration:
    runs-on: ubuntu-latest
    needs: dart
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: example
          script: flutter test integration_test

  ios:
    runs-on: macos-latest
    needs: dart
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - name: Build example app
        working-directory: example
        run: flutter build ios --simulator --debug
      - name: Boot an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # Runs before xcodebuild, which can leave the simulator unavailable to
      # `flutter devices` afterwards.
      - name: Integration tests on the simulator
        working-directory: example
        run: flutter test integration_test -d ${{ steps.simulator.outputs.udid }}
      - name: Swift unit tests (XCTest)
        working-directory: example/ios
        run: |
          # `flutter test` leaves Generated.xcconfig pointing at its temporary
          # test entrypoint; reset it to the app before building with Xcode.
          (cd .. && flutter build ios --config-only --simulator --debug)
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:RunnerTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
