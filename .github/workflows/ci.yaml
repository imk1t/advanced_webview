name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Pigeon output (*.g.dart) is committed as generated and not reformatted.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v '\.g\.dart$')
      - name: Check Pigeon output is up to date
        run: |
          dart run pigeon --input pigeons/messages.dart
          git diff --exit-code
      - run: flutter analyze
      - run: flutter test
      - name: Validate package for pub.dev
        run: flutter pub publish --dry-run

  android:
    runs-on: ubuntu-latest
    needs: dart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

  ios:
    runs-on: macos-latest
    needs: dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build example app
        working-directory: example
        run: flutter build ios --simulator --debug
