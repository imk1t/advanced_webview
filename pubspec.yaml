name: advanced_webview
description: "A simple yet feature-rich Flutter WebView plugin for Android and iOS. One typed Dart API that behaves the same on both platforms."
version: 0.9.0
repository: https://github.com/imk1t/advanced_webview
issue_tracker: https://github.com/imk1t/advanced_webview/issues
documentation: https://imk1t.github.io/advanced_webview/
topics:
  - webview
  - browser
  - pigeon
  - android
  - ios

# The integration test of client certificates ships throw-away, self-signed TLS keys
# that protect nothing; tell pub's secret scanner so.
false_secrets:
  - /example/integration_test/tls_fixtures.dart

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pinned exactly: the generated files record the Pigeon version, and CI fails
  # when regenerating them with a newer release. Bump together with a regeneration.
  pigeon: 29.0.12

flutter:
  plugin:
    platforms:
      android:
        package: dev.k1t.advanced_webview
        pluginClass: AdvancedWebViewPlugin
      ios:
        pluginClass: AdvancedWebViewPlugin
