name: flutter_mobile_webview
description: "A lean, type-safe WebView plugin for Android and iOS built on Pigeon."
version: 0.0.1
repository: https://github.com/imk1t/flutter_mobile_webview
issue_tracker: https://github.com/imk1t/flutter_mobile_webview/issues
documentation: https://github.com/imk1t/flutter_mobile_webview/blob/main/docs/architecture.md
topics:
  - webview
  - browser
  - pigeon
  - android
  - ios

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.12

flutter:
  plugin:
    platforms:
      android:
        package: dev.k1t.flutter_mobile_webview
        pluginClass: MobileWebViewPlugin
      ios:
        pluginClass: MobileWebViewPlugin
