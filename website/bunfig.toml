# Supply-chain hardening for `bun install`. Keep in sync with .npmrc.
[install]
# Record exact versions instead of ^ / ~ ranges.
exact = true

# Do not install versions published less than 7 days ago (seconds). Gives the registry and
# security vendors time to pull a compromised release before we pick it up.
minimumReleaseAge = 604800

# Fail instead of silently updating bun.lock (also passed as --frozen-lockfile in CI).
frozenLockfile = true
