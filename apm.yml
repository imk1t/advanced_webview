name: advanced_webview
version: "0.0.1"
description: Agent configuration for developing the advanced_webview Flutter plugin.
license: MIT
includes:
  - .apm/skills/**
targets:
  - agent-skills
  - claude
  - codex
dependencies:
  apm:
    - imk1t/apm-shared#v0.1.3
  mcp:
    # Dart and Flutter MCP server (ships with the Dart SDK 3.9+), run with the
    # mise-pinned SDK.
    - name: dart
      registry: false
      transport: stdio
      command: mise
      args: [exec, --, dart, mcp-server]
